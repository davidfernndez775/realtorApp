<div class="container">
  <div class="row">
    <div class="col-md-8">
      @if (images) {
      <ngb-carousel>
        <ng-template ngbSlide>
          <div class="picsum-img-wrapper">
            <img [src]="images[0]" alt="Random first slide" />
          </div>
        </ng-template>
        <ng-template ngbSlide>
          <div class="picsum-img-wrapper">
            <img [src]="images[1]" alt="Random second slide" />
          </div>
        </ng-template>
        <ng-template ngbSlide>
          <div class="picsum-img-wrapper">
            <img [src]="images[2]" alt="Random third slide" />
          </div>
        </ng-template>
      </ngb-carousel>
      }
    </div>
    <div class="col-md-4">
      <app-table-details></app-table-details>
    </div>
  </div>
</div>
