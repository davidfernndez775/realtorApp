<table class="table table-striped overflow-auto">
  <thead>
    <tr>
      <th scope="col">Country</th>
      <th scope="col">Area</th>
    </tr>
  </thead>
  <tbody>
    @for (country of countries; track country.name; let i = $index) {
    <tr>
      <td>
        {{ country.name }}
      </td>
      <td>{{ country.area | number }}</td>
    </tr>
    }
  </tbody>
</table>
