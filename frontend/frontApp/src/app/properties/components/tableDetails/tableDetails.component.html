<div class="table-scroll-container">
  <!-- tabla y contenido aquí -->
  <table class="table table-striped">
    <tbody class="scrollable-tbody">
      @for (country of countries; track country.name; let i = $index) {
      <tr>
        <td>
          {{ country.name }}
        </td>
        <td>{{ country.area | number }}</td>
      </tr>
      }
    </tbody>
  </table>
</div>
