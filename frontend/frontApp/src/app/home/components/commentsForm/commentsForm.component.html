<div class="card mb-5">
  <div class="card-body p-sm-5">
    <h3 class="text-center mb-4">Write a review of us!</h3>
    <form method="post">
      <div class="mb-3">
        <input
          id="name-2"
          class="form-control"
          type="text"
          name="name"
          placeholder="Name"
        />
      </div>
      <div class="mb-3">
        <textarea
          id="message-2"
          class="form-control"
          name="message"
          rows="6"
          placeholder="Message"
        ></textarea>
      </div>
      <div>
        <button class="btn btn-primary d-block w-100" type="submit">
          Send
        </button>
      </div>
    </form>
  </div>
</div>
